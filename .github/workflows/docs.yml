name: Build documentation and deploy to GitHub Pages
on:
  push:
    branches: ['main']
  workflow_dispatch:

# Cancel previous run (see: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # `configure-pages` runs with `enablement: true`, which turns Pages on at the
    # first run — that needs `pages: write` on the build job too.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: pmndrs/docs/.github/workflows/build.yml@v4
    with:
      mdx: 'docs'
      libname: 'design-system'
      libname_short: 'ds'
      home_redirect: '/getting-started/introduction'
      icon: '🧱'
      tag_match: 'v*.*.*'
      github: 'https://github.com/pmndrs/design-system'
      # The swatches of docs/color-system are the site's own theme: keep these
      # on the seed of registry/md3-base/md3.ts.
      theme_primary: '#323e48'
      theme_scheme: 'tonalSpot'
      theme_contrast: '0'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
