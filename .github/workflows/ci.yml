name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lgtm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # `registry.json` is generated but committed, because GitHub-based
      # resolution reads it from the repo. Nothing else would notice it drifting
      # from `scripts/build.mjs`, the docs markdown, or the seed.
      - run: npm run lgtm

  # The package is never published to npm — the git tag *is* the install address
  # (`md3#v1.2.3`), so a version bump is the whole release. changesets opens the
  # version PR; merging it tags.
  release:
    needs: lgtm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `changeset publish` creates the tag, but changesets/action pushes tags
      # only when it sees packages published to npm. This one is private and
      # publishes nothing, so the tag died with the runner every time and all
      # four so far were pushed by hand — while the install address a consumer
      # pins (`md3#v0.4.0`) is exactly that tag. Push it here.
      #
      # `createGithubReleases` came off with it: it is gated on the same signal,
      # so it never fired either. CHANGELOG.md is the release notes.
      - run: git push origin --tags
