name: Build documentation and deploy to GitHub Pages and Vercel
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

# Cancel previous run (see: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # `configure-pages` can enable Pages on the first run.
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      version_url: ${{ steps.version-url.outputs.url }}
      version_hostname: ${{ steps.version-url.outputs.hostname }}
    env:
      NEXT_PUBLIC_LIBNAME: design-system
      NEXT_PUBLIC_LIBNAME_SHORT: ds
      HOME_REDIRECT: /getting-started/introduction
      ICON: '🧱'
      GITHUB: https://github.com/pmndrs/design-system
      TAG_MATCH: 'v*.*.*'
      # The swatches and the site use the same palette as the default theme.
      THEME_PRIMARY: '#CAF543'
      THEME_SCHEME: tonalSpot
      THEME_CONTRAST: '0'
      THEME_COLOR_MATCH: 'true'
      THEME_NEUTRAL: '#c1b793'
      THEME_NEUTRAL_VARIANT: '#495720'
      THEME_ERROR: '#FF4980'
      # Keep the version switcher and the Vercel preview alias in agreement.
      VERSION_URL_TEMPLATE: https://design-system-git-{branch}-pmndrs.vercel.app/design-system
      VERSION_PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
      VERSION_BRANCHES_LIST: main
      # Source pages, assets and edit links all refer to the authored docs.
      MDX_BASEURL: https://github.com/${{ github.repository }}/raw/${{ github.head_ref || github.ref_name }}/docs
      SOURCECODE_BASEURL: https://github.com/${{ github.repository }}/tree/${{ github.head_ref || github.ref_name }}
      EDIT_BASEURL: https://github.com/${{ github.repository }}/edit/${{ github.head_ref || github.ref_name }}/docs
      CONTRIBUTORS_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - id: configurepages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # docs.config.ts supplies shared values and the local ThemeSeeds component.
      - run: pnpm run build-docs
        env:
          BASE_PATH: ${{ steps.configurepages.outputs.base_path }}
          NEXT_PUBLIC_URL: ${{ steps.configurepages.outputs.base_url }}
      - id: version-url
        run: |
          url=$(pnpm --silent run docs version-url)
          hostname=$(pnpm --silent run docs version-url --hostname)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "hostname=$hostname" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out/site

  #
  # The hosted registry: `registry.json` as static files under the site's `r/`, one
  # `<name>.json` per item plus the index, so `https://pmndrs.github.io/design-system/r/{name}.json`
  # is a shadcn namespace (see `scripts/hosted-registry.mjs`). The documentation build
  # produces a `github-pages` artifact that is unpacked here, gets
  # `r/` and the composed Storybook at its root (served under the same base path), and
  # is uploaded again as `site`: the one artifact both deployments take, so they serve the same
  # files. A new name rather than `github-pages` overwritten, which the Vercel job may be
  # downloading meanwhile.
  #
  registry:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build composed Storybook
        run: pnpm run build-storybook
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/github-pages
      - run: |
          mkdir -p "$SITE"
          tar -xf "$RUNNER_TEMP/github-pages/artifact.tar" -C "$SITE"
          pnpm run hosted-registry "$SITE/r"
          mkdir -p "$SITE/storybook"
          cp -R out/storybook/. "$SITE/storybook/"
        env:
          SITE: ${{ runner.temp }}/site
      - uses: actions/upload-pages-artifact@v5
        with:
          name: site
          path: ${{ runner.temp }}/site

  deploy:
    needs: registry
    # Pages is `main` only: the previews are the `vercel` job's
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: site

  #
  # Whatever Pages got, we deploy to Vercel too (preview for branches, production for `main`),
  # the way pmndrs/docs deploys its own site — except that this site is static, built once above
  # by the build job: so rather than having Vercel build it, the Pages artifact (`site`,
  # the docs plus the hosted registry's `r/`) is handed to it as is, in the Build
  # Output API layout (`.vercel/output`). A branch preview so serves that branch's `r/` files.
  #
  vercel:
    # `build` for its `version_hostname` output, `registry` for the `site` artifact
    needs: [build, registry]
    runs-on: ubuntu-latest
    env:
      # No token, no deployment: that is a fork's pull request, which cannot read the repo
      # secrets, or a checkout of this repo that never set them.
      VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # The same base path as the Pages build, which the artifact was built for: the site lives
      # one level down there too, and its pages link to each other by absolute path.
      BASE_PATH: /${{ github.event.repository.name }}
      PRODUCTION: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    # Update the Production/Preview environment with the Vercel deployed URL
    environment:
      name: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
      url: ${{ steps.vercel-deploy.outputs.deployment_url }}

    steps:
      - if: env.VERCEL == 'true'
        uses: actions/download-artifact@v8
        with:
          name: site
      - if: env.VERCEL == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
      - if: env.VERCEL == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: vercel-deploy
        if: env.VERCEL == 'true'
        run: |
          # Under the base path, not at the static root: that is where the site was built to
          # live, and where Pages serves it from (a project site is mapped to its repo name);
          # Vercel serves the static root at `/`.
          mkdir -p ".vercel/output/static$BASE_PATH"
          tar -xf artifact.tar -C ".vercel/output/static$BASE_PATH"
          # The website exports flat `<name>.html` pages and links to them without the extension,
          # which Pages resolves on its own. Vercel does not, even with `cleanUrls`: each page has
          # a sibling `<name>/` folder (its RSC payloads), and in the filesystem phase that folder
          # wins the lookup, with no index to serve. So, once the filesystem has had its turn (real
          # files -- assets, `.txt`, `.md` -- are served as they are), an extensionless path under
          # the base path is rewritten to its `.html`, and `check` sends it back through the
          # filesystem. `cleanUrls` stays for the other direction: `<name>.html` redirects to
          # `<name>`. The first route sends the bare deployment URL -- the one Vercel prints, and
          # the one anyone trims to -- to the home page, which sits under the base path.
          # https://vercel.com/docs/build-output-api/configuration#routes
          #
          # shellcheck disable=SC2016 # `$1` is the route's capture, not the shell's
          # Storybook uses relative assets, so its directory URL needs a trailing slash.
          printf '{"version":3,"cleanUrls":true,"routes":[{"src":"^/$","status":308,"headers":{"Location":"%s"}},{"src":"^%s/storybook$","status":308,"headers":{"Location":"%s/storybook/"}},{"handle":"filesystem"},{"src":"^%s/(.+?)/?$","dest":"%s/$1.html","check":true}]}' \
            "$BASE_PATH" "$BASE_PATH" "$BASE_PATH" "$BASE_PATH" "$BASE_PATH" > .vercel/output/config.json
          # `--archive`: one tarball, not one upload per file
          url=$(pnpm dlx vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN" \
            --target="$([ "$PRODUCTION" = 'true' ] && echo production || echo preview)")

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$url$BASE_PATH" >> "$GITHUB_OUTPUT"
          printf '### Storybook\n\n[Open composed Storybook](%s/storybook/)\n' \
            "$url$BASE_PATH" >> "$GITHUB_STEP_SUMMARY"

      # Vercel generates branch URLs (`<project>-git-<branch>-<scope>.vercel.app`) only for
      # deployments made by its Git integration, not for these CLI ones. So give each preview the
      # URL `version_url_template` links its branch to, and re-point it on every push. Production
      # needs none: `main` is the site URL. The hostname is the one the build computed from that
      # template (`version_hostname`), so the alias and the switcher cannot disagree -- a branch
      # too long for a 63-character hostname label included, which pmndrs/docs cuts and hashes.
      #
      # Fatal, unlike in pmndrs/docs: the alias is what the switcher needs, and a preview nobody
      # can reach from it is not a preview.
      #
      # The REST API rather than `vercel alias set`, which pmndrs/docs uses: the CLI starts
      # that command by looking the user up (with or without `--scope`), and `VERCEL_TOKEN` is
      # scoped to the project, with no user to show -- `User not found (404)`. The API takes the
      # token as it is, the deployment by its URL, and the team from `teamId`.
      # https://vercel.com/docs/rest-api/reference/endpoints/aliases/assign-an-alias
      - name: Alias the preview to its branch URL
        if: env.VERCEL == 'true' && env.PRODUCTION != 'true'
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            "https://api.vercel.com/v2/deployments/${DEPLOYMENT#https://}/aliases?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"alias\":\"$ALIAS\"}"
        env:
          DEPLOYMENT: ${{ steps.vercel-deploy.outputs.url }}
          ALIAS: ${{ needs.build.outputs.version_hostname }}
