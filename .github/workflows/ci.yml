name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lgtm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The one step with no local counterpart: `examples/app` reads the palette
      # back out of a real browser, and the runner has none.
      - run: pnpm --filter example-app exec playwright install --with-deps chromium

      # `registry.json` is generated but committed, because GitHub-based
      # resolution reads it from the repo. Nothing else would notice it drifting
      # from `scripts/build.mjs`, the docs markdown, or the seed.
      #
      # The same command as locally, and it ends by installing the registry into
      # `examples/app` — the only check that exercises `shadcn add` at all.
      - run: pnpm lgtm

  # The package is never published to npm — the git tag *is* the install address
  # (`md3#v1.2.3`), so a version bump is the whole release. changesets opens the
  # version PR; merging it tags.
  release:
    needs: lgtm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `changeset publish` creates the tag, but changesets/action pushes tags
      # only when it sees packages published to npm. This one is private and
      # publishes nothing, so the tag died with the runner every time and the
      # first ones were pushed by hand — while the install address a consumer
      # pins (`md3#v0.4.0`) is exactly that tag. Push it here.
      - run: git push origin --tags

      # `createGithubReleases` is gated on the same signal, so changesets/action
      # never creates a release either. Create it here, with the version's
      # CHANGELOG.md section as its notes — changesets already wrote them.
      #
      # Every push to main runs this, and only the version-PR merge brings a new
      # tag: any other run finds the current version already released, or not
      # tagged yet, and does nothing.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if ! git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag is not tagged, nothing to release"
          elif gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released"
          else
            node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
